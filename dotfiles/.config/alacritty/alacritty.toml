# Material3UI Configuration
# Keep the line above to receive Material3UI updates; delete it to keep your own config.

[general]
import = ["~/.config/alacritty/material3ui-theme.toml"]
live_config_reload = true

[window]
decorations = "None"
padding = { x = 12, y = 12 }
opacity = 0.96
dynamic_title = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11.0

[scrolling]
history = 10000

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[mouse]
hide_when_typing = true

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
]
