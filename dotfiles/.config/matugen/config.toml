# Material3UI Configuration
# Do not delete the comment above if you want to receive Material3UI configuration updates.
# Delete it if you want to use your own configuration and avoid it getting overridden.
[config]
# Matugen v4 Configuration
# Using import_json_files if custom variables were needed, but keeping it simple for now.

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/material3ui/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/material3ui-theme.toml'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty_theme.conf'
output_path = '~/.config/kitty/current-theme.conf'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'
post_hook = '~/.local/share/material3ui/scripts/colors/apply_system_theme.sh'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.discord]
input_path = "~/.config/matugen/templates/midnight.theme.css"
output_path = "~/.config/vesktop/themes/midnight.theme.css"

# App themes: generated here, then installed by apply_app_themes.sh into
# the apps that are present (nothing is created for apps you do not use)

# VS Code, Code - OSS / VSCodium, Cursor, Windsurf, Antigravity: pick
# "Material3UI" in Preferences → Color Theme once
[templates.vscode]
input_path = "~/.config/matugen/templates/vscode-color-theme.json"
output_path = "~/.local/state/quickshell/user/generated/apps/vscode-theme.json"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh vscode"

# Firefox, LibreWolf, Floorp, Zen: userChrome/userContent, on next start
[templates.firefox_chrome]
input_path = "~/.config/matugen/templates/apps/firefox-userChrome.css"
output_path = "~/.local/state/quickshell/user/generated/apps/firefox-userChrome.css"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh firefox"

[templates.firefox]
input_path = "~/.config/matugen/templates/apps/firefox-userContent.css"
output_path = "~/.local/state/quickshell/user/generated/apps/firefox-userContent.css"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh firefox"

[templates.foot]
input_path = "~/.config/matugen/templates/apps/foot.ini"
output_path = "~/.local/state/quickshell/user/generated/apps/foot.ini"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh foot"

[templates.ghostty]
input_path = "~/.config/matugen/templates/apps/ghostty"
output_path = "~/.local/state/quickshell/user/generated/apps/ghostty"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh ghostty"

# WezTerm: config.color_scheme = "Material3UI"
[templates.wezterm]
input_path = "~/.config/matugen/templates/apps/wezterm.toml"
output_path = "~/.local/state/quickshell/user/generated/apps/wezterm.toml"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh wezterm"

[templates.zathura]
input_path = "~/.config/matugen/templates/apps/zathurarc"
output_path = "~/.local/state/quickshell/user/generated/apps/zathurarc"
post_hook = "~/.local/share/material3ui/scripts/colors/apply_app_themes.sh zathura"

[templates.zeditor]
input_path = "~/.config/matugen/templates/zed_theme.json"
output_path = "~/.local/share/zed/extensions/installed/material-dark/themes/zed_material_theme.json"

#[templates.spicetify]
#input_path = "~/.config/matugen/templates/spicetify-color.ini"
#output_path = "~/.config/spicetify/Themes/caelestia/color.ini"

[templates.cava]
input_path = '~/.config/matugen/templates/cava_color.ini'
output_path = '~/.config/cava/config'
post_hook = "pkill -USR1 cava"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian_matugen.css'
# output_path = '~/Documents/Obsidian-Vault/.obsidian/snippets/matugen.css' # Example: path to your obsidian vault snippet

[templates.terminal]
input_path = '~/.config/matugen/templates/terminal/sequences.txt'
output_path = '~/.local/state/quickshell/user/generated/terminal/sequences.txt'
post_hook = "~/.local/share/material3ui/scripts/colors/apply_terminal_colors.sh"
