# Aura Shell — Hyprland defaults
$mod = SUPER
$terminal = foot
$browser = librewolf
$fileManager = thunar
$aura = auractl

monitor=,preferred,auto,1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = quickshell -c aura
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = aura-system clipboard-watch
exec-once = mako

general { gaps_in = 5; gaps_out = 10; border_size = 2; col.active_border = rgba(c3c6d0ff); col.inactive_border = rgba(3d4048cc); layout = dwindle }
decoration { rounding = 20; blur { enabled = true; size = 8; passes = 3 }; shadow { enabled = true; range = 16; render_power = 3 } }
# Aura's Quickshell surfaces use this namespace.  The translucent panels below
# are blurred by Hyprland rather than rendering an expensive QML imitation.
layerrule = blur, ^(aura)$
layerrule = ignorealpha 0.18, ^(aura)$
animations { enabled = true; bezier = material, 0.2, 0, 0, 1; animation = windows, 1, 4, material; animation = workspaces, 1, 5, material }
input { kb_layout = us; follow_mouse = 1; touchpad { natural_scroll = true; tap-to-click = true } }

bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, Space, exec, $aura launcher
bind = $mod, C, exec, $aura controlCenter
bind = $mod, N, exec, $aura notifications
bind = $mod, S, exec, $aura settings
bind = $mod, V, exec, $aura clipboard
bind = $mod, P, exec, $aura power
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, S, exec, aura-system screenshot
bind = $mod SHIFT, V, exec, aura-system record
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
