# Material3UI: the shell locks and blanks the screen itself (Settings → Lock &
# idle); hypridle only routes loginctl lock-session to it and suspends after
# an hour.
$lock_cmd = material3ui msg lock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    inhibit_sleep = 3
}

listener {
    timeout = 3600 # 60mins
    on-timeout = $suspend_cmd
}
