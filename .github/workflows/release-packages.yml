# Attaches the pacman packages to each published release: material3ui (the
# shell) and material3ui-greeter (the login screen)
name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach (e.g. v4.5.0)
        required: true

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm git github-cli
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Build dependencies
        # The libraries the shell links against; runtime-only ones are skipped
        run: |
          source packaging/material3ui/PKGBUILD
          pacman -S --needed --noconfirm "${makedepends[@]}" $(printf '%s\n' "${depends[@]}" | grep -vx hyprland)
      - name: Build
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '*' && cd '$GITHUB_WORKSPACE' &&
            packaging/build-pkg.sh material3ui '$GITHUB_WORKSPACE/out' &&
            packaging/build-pkg.sh material3ui-greeter '$GITHUB_WORKSPACE/out'"
      - name: Names for older updaters
        # A pre-release's package is 6.0beta1; updaters before 6.0 ask for
        # the tag's own spelling (6.0-beta-1): a copy under that name too
        shell: bash
        run: |
          ver="${TAG#v}"
          if [[ "$ver" == *-* ]]; then
            for f in out/material3ui-"${ver//-/}"-*.pkg.tar.zst; do
              if [[ -e "$f" ]]; then cp "$f" "${f/${ver//-/}/$ver}"; fi
            done
          fi
          ls out
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" out/*.pkg.tar.zst --clobber
